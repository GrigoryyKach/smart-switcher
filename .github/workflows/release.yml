name: Release

# Builds the Windows package and publishes a GitHub Release when a vX.Y.Z tag is pushed.
# The NIMVORO launcher downloads SmartSwitcher-win-x64.zip from the release (name set in nimvoro.json).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version matches the tag
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "VERSION=$v" >> $env:GITHUB_ENV
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            throw "Tag ${{ github.ref_name }} does not match version $v"
          }

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Helper self-test
        run: npm run selftest

      - name: Build
        run: npm run package

      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path dist/SmartSwitcher-win32-x64/* -DestinationPath SmartSwitcher-win-x64.zip -Force

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v') { $tag = "v$env:VERSION" }
          gh release create $tag "SmartSwitcher-win-x64.zip" --title "Smart Switcher $tag" --generate-notes --verify-tag
